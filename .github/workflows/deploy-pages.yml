# GitHub Pages 部署（Netlify 超出额度期间的临时方案）
# 构建产物写入 dist/，SPA 深链接通过复制 404.html 兜底。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate contributors.json
        run: node scripts/fetch-contributors.mjs public/contributors.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build
        env:
          # GitHub Pages 项目站点路径（仓库名），构建产物资源以此前缀部署
          VITE_BASE: /yishen-navigation/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          LLM_API_KEY: sk-e4fd8e41c68b498590af09b8df5d394b
          SUPABASE_URL: https://naaczfnskkpsujdfwurj.supabase.co
          SUPABASE_ANON_KEY : sb_publishable_yP5KQyXarTJ5Ap0xoxmp8Q_TCA2V1OM

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
