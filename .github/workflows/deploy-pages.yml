name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免并发覆盖
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 项目页地址是 https://<用户>.github.io/yishen-navigation/，
      # 所以 base 必须带仓库名前缀（VITE_BASE 会被 vite.config.js 读取）。
      # Supabase 凭据在构建期被内联进前端包，需要配置为仓库 Secrets。
      - name: Build for GitHub Pages
        env:
          VITE_BASE: /yishen-navigation/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_FUNCTIONS_BASE: ${{ vars.VITE_FUNCTIONS_BASE }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::缺少构建期变量 VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY（Settings → Secrets and variables → Actions）"
            exit 1
          fi
          npm run build:pages

      # enablement: true 让 Actions 自己开启 Pages（首次部署不用手动去 Settings 点）
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
