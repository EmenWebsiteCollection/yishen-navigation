name: deploy-yishennav
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-yishennav
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: *** secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: *** secrets.VITE_SUPABASE_ANON_KEY }}
      - name: setup ssh
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      - name: backup
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            'mkdir -p ~/backup && tar czf ~/backup/yishennav-$(date +%F-%H%M).tgz -C /var/www yishennav'
      - name: deploy
        run: |
          rsync -az --delete --chown=www-data:www-data dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/yishennav/
      - name: smoke test
        run: curl -fsS -o /dev/null -w '%{http_code}\n' https://yishennav.raicco.cn
