name: deploy-yishennav
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-yishennav
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install
        run: npm install

      - name: build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: write version
        run: |
          printf '{"origin":"github","commit":"%s","ref":"%s","built":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$(date -u +%FT%TZ)" > dist/version.json
          cat dist/version.json

      - name: setup ssh
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: backup
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'mkdir -p ~/backup && tar czf ~/backup/yishennav-$(date +%F-%H%M).tgz -C /var/www yishennav'

      - name: deploy
        run: |
          rsync -rltz --delete --chmod=D775,F664 \
            --exclude=status.html --exclude=status.json \
            dist/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/yishennav/

      - name: smoke test
        run: |
          curl -fsS -o /dev/null -w 'site=%{http_code}\n' https://yishennav.raicco.cn/
          curl -fsS -o /dev/null -w 'version=%{http_code}\n' https://yishennav.raicco.cn/version.json
