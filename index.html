<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpeg" href="/yili.jpg" />
    <title>网站导航平台</title>
    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem('ym-theme');
          var themes = ['default', 'catppuccin', 'tokyonight', 'onedark', 'dracula', 'macos'];
          if (saved && themes.indexOf(saved) !== -1) {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
