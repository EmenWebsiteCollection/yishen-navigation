[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# SPA 路由：任何找不到的路径都回 index.html，由前端 JS 接管路由
# （修复深链接直接访问/刷新 404，如 /website/xxx、/user/xxx）
# 说明：/.netlify/functions/* 由 Netlify 优先处理，不受此规则影响
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ═══ 静态缓存与安全响应头 ═══
# Vite 构建产物带内容哈希，可长期缓存（浏览器/CDN 复用，避免并发回源打爆）
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 看板郎优化后图片：文件名固定但由脚本生成，内容稳定，可长期缓存
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/yili-small.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html 不缓存：保证每次都能拿到最新 JS 入口
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# 基础安全响应头：防 MIME 嗅探 / 点击劫持 / 外站来源泄露
# 注意：本文件与 _headers 同时存在时，同路径规则以本文件为准（issue #146）——
# 原 _headers 里的 CSP 因此从未在线上生效，现已合并到这里并删除 _headers。
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "frame-ancestors 'none'; connect-src 'self' https://naaczfnskkpsujdfwurj.supabase.co wss://naaczfnskkpsujdfwurj.supabase.co https://*.supabase.co https://api.microlink.io"
